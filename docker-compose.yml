name: Venome
services:

  catalog-api:
    image: ${DOCKER_REGISTRY-}catalogapi
    build:
      context: ./src
      dockerfile: Services/Catalog/Catalog.Api/Dockerfile
    depends_on:
      - redis
      - catalog-db
  # Sql Server Container

  catalog-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Admin@12345Strong"
    ports:
      - "1433:1433"
    volumes:
      - catalog-db-data:/var/opt/mssql

  redis:
    image: redis:8
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    ports:
      - "5540:5540"
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  catalog-db-data:
  redis_data: