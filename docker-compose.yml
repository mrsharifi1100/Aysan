name: Venome
services:

  catalog-api:
    image: ${DOCKER_REGISTRY-}catalogapi
    build:
      context: ./src
      dockerfile: Services/Catalog/Catalog.Api/Dockerfile
    depends_on:
      - redis
      - catalog-db

  discount-api:
    image: ${DOCKER_REGISTRY-}discountapi
    build:
      context: .
      dockerfile: src/Services/Discount/Discount.Api/Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
    CatalogGrpcUrl: http://catalog-api:8082
    
  gateway-web:
    build:
      context: .
      dockerfile: src/ApiGateways/GateWay.Web/Dockerfile
    ports:
      - "6001:6001"
    environment:
      ASPNETCORE_HTTP_PORTS: 6001
    depends_on:
      - catalog-api

  catalog-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Admin@12345Strong"
    ports:
      - "1433:1433"
    volumes:
      - catalog-db-data:/var/opt/mssql

  redis:
    image: redis:8
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    ports:
      - "5540:5540"
    depends_on:
      - redis
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data

volumes:
  catalog-db-data:
  redis_data:
  keycloak_data: